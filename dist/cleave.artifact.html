<style>
#app{height:100vh}
/* cleave: VSCode-style diff. All styles scoped under .cleave so it drops into any page
   without leaking. Single committed dark theme (IDE aesthetic); the caller gives the
   .cleave element a height. Highlight palette: red removed, green added, amber modified. */
.cleave{
  color-scheme: dark;
  --bg:#1e1e1e; --panel:#252526; --titlebar:#323233; --pad:#1b1b1b;
  --text:#d4d4d4; --dim:#8b8b8b; --faint:#6a6a6a;
  --divider:#3c3c3c; --line:#2a2a2a; --accent:#4aa5f0;

  --del:#f85149; --del-bg:rgba(248,81,73,.22); --del-word:rgba(248,81,73,.45);
  --add:#3fb950; --add-bg:rgba(63,185,80,.20); --add-word:rgba(63,185,80,.42);
  --mod:#e2b93d; --mod-bg:rgba(226,185,61,.11);

  --k:#569cd6; --str:#ce9178; --fn:#dcdcaa; --num:#b5cea8; --ty:#4ec9b0; --prop:#9cdcfe; --cm:#6a9955;
  --ui:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rowh:22px; --connw:96px; --mmw:84px; --tab:4; --nd:3;
  --cols:minmax(0,1fr) var(--connw) minmax(0,1fr);

  display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden;position:relative;
  background:var(--bg);color:var(--text);font-family:var(--ui);
}
.cleave.no-conn{--connw:0px}
.cleave.unified{--cols:minmax(0,1fr)}
.cleave *{box-sizing:border-box}
.cleave :focus-visible{outline:1px solid var(--accent);outline-offset:-1px}

.cleave .titlebar{background:var(--titlebar);display:flex;align-items:center;gap:10px;
  padding:8px 14px;border-bottom:1px solid #000;flex:none}
.cleave .dots{display:flex;gap:7px;margin-right:4px}
.cleave .dots i{width:12px;height:12px;border-radius:50%}
.cleave .dots i:nth-child(1){background:#ff5f56}.cleave .dots i:nth-child(2){background:#ffbd2e}.cleave .dots i:nth-child(3){background:#27c93f}
.cleave .fname{font-family:var(--mono);font-size:12.5px;color:#cfcfcf}
.cleave .fname b{color:#fff;font-weight:700}
.cleave .titlebar .sub{color:var(--faint);font-size:12px}

.cleave .ribbon{background:var(--panel);border-bottom:1px solid var(--divider);
  display:flex;align-items:center;gap:20px;padding:11px 16px;flex-wrap:wrap;flex:none}
.cleave .stats{display:flex;gap:20px}
.cleave .stat{display:flex;flex-direction:column;gap:1px}
.cleave .stat .n{font-family:var(--mono);font-size:19px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.cleave .stat .l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.cleave .n.add{color:var(--add)}.cleave .n.del{color:var(--del)}.cleave .n.mod{color:var(--mod)}.cleave .n.mv{color:var(--text)}
.cleave .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cleave .tb{font:inherit;font-size:11.5px;color:var(--text);background:#2d2d2d;border:1px solid var(--divider);
  border-radius:4px;padding:3px 8px;cursor:pointer;line-height:1.3}
.cleave .tb:hover{background:#383838}
.cleave .tb[aria-pressed="true"]{background:#4a4a4a;border-color:var(--faint);color:#fff}
.cleave .navpos{font-family:var(--mono);font-size:11.5px;color:var(--dim);min-width:7ch;text-align:center;font-variant-numeric:tabular-nums}
.cleave .nav-next{margin-right:8px}
.cleave .spacer{flex:1}
.cleave .legend{display:flex;gap:13px;align-items:center;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
.cleave .legend span{display:inline-flex;align-items:center;gap:6px}
.cleave .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.cleave .sw.a{background:var(--add-bg);box-shadow:inset 2px 0 0 var(--add)}
.cleave .sw.d{background:var(--del-bg);box-shadow:inset 2px 0 0 var(--del)}
.cleave .sw.m{background:var(--mod-bg);box-shadow:inset 2px 0 0 var(--mod)}
.cleave .sw.v{background:linear-gradient(90deg,var(--del-bg) 50%,var(--add-bg) 50%);box-shadow:inset 2px 0 0 var(--del),inset -2px 0 0 var(--add)}
.cleave .sw.w{background:linear-gradient(90deg,var(--del-word) 50%,var(--add-word) 50%)}

.cleave .stage{flex:1;min-height:0;display:flex}
.cleave .editor{flex:1;min-width:0;overflow:auto;position:relative}
/* headers, body and the sticky scrollbar row share one column template, so the WHERE
   column lines up exactly whatever the scrollbar or minimap width */
.cleave .heads,.cleave .grid,.cleave .hbar{display:grid;grid-template-columns:var(--cols);min-width:640px}
.cleave .heads{position:sticky;top:0;z-index:4;background:var(--panel);border-bottom:1px solid var(--divider)}
.cleave .heads .h{padding:7px 14px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden}
.cleave .heads .h.r,.cleave .heads .h .r{color:#9fd0a0}
.cleave .heads .h.mid{position:relative;overflow:visible;text-align:center;color:var(--faint);border-inline:1px solid var(--divider);padding-inline:0}
.cleave .heads .h b{font-family:var(--mono);text-transform:none;letter-spacing:0;color:#cdcdcd;font-weight:400}
.cleave .grid{position:relative}

/* each pane scrolls horizontally (driven by the sticky bars below); the gutter stays pinned */
.cleave .pane{display:grid;grid-template-columns:max-content minmax(max-content,1fr);align-content:start;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.cleave .pane::-webkit-scrollbar{display:none}
.cleave .hbar{position:sticky;bottom:0;z-index:4;background:var(--bg)}
.cleave .hs{overflow-x:auto;overflow-y:hidden;height:12px;scrollbar-width:thin;scrollbar-color:#4a4a4a transparent}
.cleave .hs>div{height:1px}
.cleave .hs.none{visibility:hidden}

/* WHERE column: bands, move lanes, resize grips */
.cleave .conn{position:relative;background:var(--bg);border-inline:1px solid var(--line)}
.cleave.no-conn .conn{border-inline:0}
.cleave .conn svg{position:absolute;left:0;top:0;display:block;pointer-events:none;overflow:visible}
.cleave .conn .ml{fill:none;stroke:var(--faint);stroke-width:1.2}
.cleave .conn .mh{fill:var(--faint)}
.cleave .conn .hit{fill:none;stroke:transparent;stroke-width:10;pointer-events:stroke;cursor:pointer}
.cleave .conn g.mv:hover .ml{stroke:var(--text)}.cleave .conn g.mv:hover .mh{fill:var(--text)}
.cleave .conn g.mv.sel .ml{stroke:var(--mod);stroke-width:1.6}.cleave .conn g.mv.sel .mh{fill:var(--mod)}
.cleave .grip{position:absolute;top:0;bottom:0;width:7px;cursor:col-resize;z-index:3}
.cleave .grip.l{left:-4px}.cleave .grip.r{right:-4px}
.cleave .grip:hover,.cleave .grip.drag{background:rgba(255,255,255,.10)}

.cleave .g,.cleave .c{--tint:transparent;height:var(--rowh);line-height:var(--rowh);
  background:linear-gradient(var(--tint),var(--tint)),var(--bg);font-family:var(--mono)}
.cleave .g{text-align:right;color:var(--faint);user-select:none;padding:0 10px;white-space:nowrap;
  font-size:12px;font-variant-numeric:tabular-nums;position:sticky;left:0;z-index:1}
.cleave .g .n1,.cleave .g .n2{display:inline-block;min-width:calc(var(--nd) * 1ch)}
.cleave .g .n2{margin-left:10px}
.cleave .c{padding:0 12px;white-space:pre;font-size:12.5px;tab-size:var(--tab)}

.cleave .r-del{--tint:var(--del-bg)}
.cleave .r-add{--tint:var(--add-bg)}
.cleave .r-mod{--tint:var(--mod-bg)}
.cleave .c.r-del{box-shadow:inset 2px 0 0 var(--del)}
.cleave .c.r-add{box-shadow:inset 2px 0 0 var(--add)}
.cleave .c.r-mod{box-shadow:inset 2px 0 0 var(--mod)}
/* a line changed inside a moved block reads as modified */
.cleave .g.r-pc,.cleave .c.r-pc{--tint:var(--mod-bg)}
.cleave .c.r-pc{box-shadow:inset 2px 0 0 var(--mod)}
.cleave .r-mv{cursor:pointer}
/* hatch tiles are exactly half a row, so stacked padding rows form one seamless field;
   the gutter stays solid (as in VSCode) so the pattern never breaks at the gutter edge */
.cleave .g.r-pad,.cleave .c.r-pad{box-shadow:none;background:var(--pad);cursor:default}
.cleave .c.r-pad{background-size:calc(var(--rowh) / 2) calc(var(--rowh) / 2);
  background-image:linear-gradient(135deg,rgba(255,255,255,.03) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.03) 50%,rgba(255,255,255,.03) 75%,transparent 75%)}
.cleave .mk{display:inline-block;width:1ch;margin-right:2px;font-weight:700}
.cleave .r-del .mk{color:var(--del)}.cleave .r-add .mk{color:var(--add)}.cleave .r-mod .mk,.cleave .r-pc .mk{color:var(--mod)}
.cleave .g.hoverrow,.cleave .c.hoverrow{filter:brightness(1.25)}
.cleave .flash{animation:cleave-flash 1s ease-out}
@keyframes cleave-flash{0%{filter:brightness(1.9)}100%{filter:none}}

.cleave .fold{grid-column:1/-1;height:var(--rowh);display:flex;align-items:center;gap:8px;width:100%;margin:0;
  padding:0 14px;background:#252526;color:var(--dim);font:11.5px var(--ui);text-align:left;cursor:pointer;
  border:0;border-block:1px solid var(--line)}
.cleave .fold:hover{background:#2d2d2d;color:var(--text)}

.cleave .caret{position:absolute;right:2px;top:50%;transform:translateY(-50%);font-size:11px;line-height:1}
.cleave .caret.d{color:var(--del)}.cleave .caret.a{color:var(--add)}

.cleave .chg{border-radius:2px;padding:1px 0}
.cleave .paneL .chg{background:var(--del-word)}
.cleave .paneR .chg{background:var(--add-word)}
/* unified modified / changed-in-move lines: old line red words, new line green words */
.cleave .paneU [data-side="L"] .chg{background:var(--del-word)}
.cleave .paneU [data-side="R"] .chg{background:var(--add-word)}

/* moved blocks: every end outlined grey, the selected move amber; a header row carries
   the label and, for moves with changes, a Compare button */
.cleave .mvbox{position:absolute;border:1px solid #5a5a5a;border-radius:2px;pointer-events:none;z-index:2}
.cleave .mvbox.sel{border-color:var(--mod)}
.cleave .mvhead{grid-column:1/-1;height:var(--rowh);background:var(--bg)}
.cleave .mvin{position:sticky;left:0;display:flex;align-items:center;justify-content:flex-end;gap:6px;height:100%;padding:0 8px}
.cleave .mvgo,.cleave .mvcmp{font:11.5px var(--ui);color:var(--dim);background:none;border:0;padding:1px 4px;cursor:pointer;border-radius:3px}
.cleave .mvgo:hover{color:var(--text);text-decoration:underline}
.cleave .mvcmp{color:var(--text);background:#3a3a3a;padding:1px 7px}
.cleave .mvcmp:hover{background:#4a4a4a}

/* Compare window over the diff */
.cleave .cmp{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;padding:28px}
.cleave .cmp-win{flex:1;display:flex;flex-direction:column;min-width:0;border:1px solid var(--mod);border-radius:6px;
  overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.6);background:var(--bg)}
.cleave .cmp-bar{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;background:var(--titlebar);font-size:12px;color:var(--text);flex:none}
.cleave .cmp-body{flex:1;min-height:0}
.cleave .cmp .cleave .titlebar{display:none}

.cleave .k{color:var(--k)}.cleave .str{color:var(--str)}.cleave .fn{color:var(--fn)}.cleave .cm{color:var(--cm);font-style:italic}
.cleave .num{color:var(--num)}.cleave .ty{color:var(--ty)}.cleave .prop{color:var(--prop)}.cleave .pl{color:var(--text)}

/* minimap: miniature of the diff, draggable viewport slider */
.cleave .minimap{flex:none;width:var(--mmw);position:relative;background:#181818;
  border-left:1px solid var(--divider);cursor:pointer;touch-action:none;user-select:none}
.cleave.no-minimap .minimap{display:none}
.cleave .minimap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cleave .mm-view{position:absolute;left:0;right:0;background:rgba(121,121,121,.24);
  border-block:1px solid rgba(255,255,255,.12);pointer-events:none}
.cleave .minimap:hover .mm-view,.cleave .minimap.drag .mm-view,.cleave .minimap:focus-visible .mm-view{background:rgba(121,121,121,.36)}

@media (max-width:720px){
  .cleave{--mmw:48px}
  .cleave .ribbon{gap:12px}.cleave .stat .n{font-size:16px}
  .cleave .c,.cleave .g{font-size:11px}
}

 * Multiple instances per page are fine (all lookups are scoped to the target);
 * rendering into the same element again cleans up the previous instance.
 * Exposes: Cleave.render, Cleave.lineDiff, Cleave.langFromFilename, Cleave.version
